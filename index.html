<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Módulo Policial San José - E.P.I. N°3</title>
    
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
        }
        .popup-header {
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
            color: #1a1a1a;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Coordenadas centradas en el área del Módulo Policial San José
        var lat = -17.962;
        var lng = -67.125;

        // Inicializar mapa optimizado para pantallas de alta densidad
        var map = L.map('map', {
            center: [lat, lng],
            zoom: 15,
            zoomControl: true,
            tap: false
        });

        // Capa de mapa base en HD (CartoDB Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            maxNativeZoom: 18,
            detectRetina: true, // Maximiza la nitidez en pantallas de celulares HD
            subdomains: 'abcd',
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        // Delimitación geográfica (Polígono estilizado con bordes finos)
        var polygonCoords = [
            [-17.9542, -67.1278],
            [-17.9565, -67.1270],
            [-17.9592, -67.1245],
            [-17.9615, -67.1170],
            [-17.9625, -67.1165],
            [-17.9658, -67.1188],
            [-17.9678, -67.1205],
            [-17.9642, -67.1238],
            [-17.9610, -67.1285],
            [-17.9580, -67.1292]
        ];

        var polygon = L.polygon(polygonCoords, {
            color: '#0055ff',      // Azul nítido para el borde
            weight: 2.5,           // Ancho fino para evitar bordes gruesos/pixeleados
            opacity: 0.9,
            fillColor: '#3388ff',
            fillOpacity: 0.25      // Transparencia limpia del área
        }).addTo(map);

        // Marcador e Info del Módulo Policial
        var marker = L.marker([-17.9575, -67.1220]).addTo(map);
        marker.bindPopup("<div class='popup-header'>MÓDULO POLICIAL<br>SAN JOSÉ<br><small>E.P.I. N°3</small></div>").openPopup();

        // Ajustar la vista automáticamente al límite del polígono
        map.fitBounds(polygon.getBounds());
    </script>
</body>
</html>
